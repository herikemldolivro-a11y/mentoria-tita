name: Fetch official institution logos

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch-official-logos.py"
      - ".github/workflows/fetch-official-logos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-logos:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Fetch official assets
        run: python scripts/fetch-official-logos.py

      - name: Upload fetched assets as artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-institution-logos
          path: |
            public/concursos
            docs/image-sources.md
          if-no-files-found: warn

      - name: Commit fetched assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/concursos docs/image-sources.md
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "chore: add verified official institution logos [skip ci]"
          git push
